[workspace]
resolver = "2"
members = ["modules/encode", "modules/video"]

[workspace.package]
edition = "2024"
rust-version = "1.89"
version = "0.1.0"

[workspace.dependencies]
amaterasu-abi = { git = "file:///tmp/amaterasu-modular-repos/foundation-v3", rev = "583c273eeecff539d5aed055c3ef6916abe0f481" }
amaterasu-module-sdk = { git = "file:///tmp/amaterasu-modular-repos/foundation-v3", rev = "583c273eeecff539d5aed055c3ef6916abe0f481" }
amaterasu-media = { git = "file:///tmp/amaterasu-modular-repos/foundation-v3", rev = "583c273eeecff539d5aed055c3ef6916abe0f481" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.3"
libloading = "0.8"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
