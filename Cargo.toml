[workspace]
resolver = "2"
members = ["modules/encode", "modules/video"]

[workspace.package]
license = "MIT"
edition = "2024"
rust-version = "1.89"
version = "0.1.0"

[workspace.dependencies]
amaterasu-abi = { git = "https://github.com/nonary-streams/amaterasu-sdk.git", rev = "6532699fdce2a0335e9b23ea96c9dfdbfec597a1" }
amaterasu-module-sdk = { git = "https://github.com/nonary-streams/amaterasu-sdk.git", rev = "6532699fdce2a0335e9b23ea96c9dfdbfec597a1" }
amaterasu-media = { git = "https://github.com/nonary-streams/amaterasu-sdk.git", rev = "6532699fdce2a0335e9b23ea96c9dfdbfec597a1" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.3"
libloading = "0.8"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
