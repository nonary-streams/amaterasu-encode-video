[package]
name = "amaterasu-video"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/nonary-streams/amaterasu-encode-video"
[lib]
crate-type = ["cdylib", "rlib"]
[features]
linux-ffmpeg-convert = []
[dependencies]
amaterasu-module-sdk.workspace = true
amaterasu-media.workspace = true
serde.workspace = true
serde_json.workspace = true
getrandom.workspace = true
[build-dependencies]
cc = "1"
pkg-config = "0.3"
[dev-dependencies]
amaterasu-runtime = { path = "../../../crates/runtime" }
[lints]
workspace = true
